name: welly-watch

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: welly-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watch.py

      - name: 상태 저장
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "welly-watch"
            git config user.email "welly-watch@users.noreply.github.com"
            git add state.json
            git commit -m "상태 갱신"
            git push
          fi
